# Application Name & Port
spring.application.name=mentorship-platform
server.port=8081
spring.jpa.open-in-view=false

# ========================================
# H2 In-Memory Database Configuration
# ========================================
# 'jdbc:h2:mem:mentordb' means the database runs completely in RAM.
# 'DB_CLOSE_DELAY=-1' ensures the database doesn't shut down as long as the JVM is alive.
spring.datasource.url=jdbc:h2:mem:mentordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================================
# Spring Data JPA / Hibernate Configuration
# ========================================
# Automatically creates or updates table schemas in H2 based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Prints clean SQL statements to the console so you can see what Hibernate executes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# H2 Web Console Configuration (Disabled)
# ========================================
spring.h2.console.enabled=false
